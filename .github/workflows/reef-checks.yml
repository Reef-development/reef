name: REEF Checks

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:

  quick-tests:
    name: Quick Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quick tests
        run: npm run test:quick

  database-tests:
    name: Database Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database tests
        run: npm run test:db
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          RLS_USER_A_EMAIL: ${{ secrets.RLS_USER_A_EMAIL }}
          RLS_USER_A_PASSWORD: ${{ secrets.RLS_USER_A_PASSWORD }}
          RLS_USER_B_EMAIL: ${{ secrets.RLS_USER_B_EMAIL }}
          RLS_USER_B_PASSWORD: ${{ secrets.RLS_USER_B_PASSWORD }}
          RLS_MANAGER_A_EMAIL: ${{ secrets.RLS_MANAGER_A_EMAIL }}
          RLS_MANAGER_A_PASSWORD: ${{ secrets.RLS_MANAGER_A_PASSWORD }}
          RLS_MANAGER_B_EMAIL: ${{ secrets.RLS_MANAGER_B_EMAIL }}
          RLS_MANAGER_B_PASSWORD: ${{ secrets.RLS_MANAGER_B_PASSWORD }}
          RLS_OWNER_EMAIL: ${{ secrets.RLS_OWNER_EMAIL }}
          RLS_OWNER_PASSWORD: ${{ secrets.RLS_OWNER_PASSWORD }}

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Was missing: without it eslint is not installed and the job fails before linting.
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  api-check:
    name: API Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: API check
        run: npm run api:check

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            api/package-lock.json

      - name: Build shared
        working-directory: shared
        run: npm ci && npm run build

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: API typecheck
        working-directory: api
        run: npm run typecheck

      - name: API tests
        working-directory: api
        run: npm test

      - name: Endpoint list matches the code
        working-directory: api
        run: npm run endpoints:check

  secrets-check:
    name: Secrets Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secrets check
        run: npm run secrets:check