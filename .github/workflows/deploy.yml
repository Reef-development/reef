name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one deploy at a time. If a second push to main arrives while one is running,
# the new one waits. This prevents two migrations from racing against the same database.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    env:
      # Supabase production runs Postgres 17. The PGDG repo installs the matching
      # client tools at this path; the distro's default is 16, which pg_dump refuses
      # to run against a 17 server.
      PG_BIN: /usr/lib/postgresql/17/bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            api/package-lock.json

      # The deploy workflow uses psql and pg_dump to back up and to migrate. The
      # distro package is Postgres 16; production runs 17. Install the matching
      # client from the PostgreSQL Global Development Group repository.
      - name: Install PostgreSQL client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # 1. Back up the live database. The dump is attached to the workflow run as an
      #    artefact, so it is available if the deploy needs to be reverted.
      - name: Back up the live database
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
        run: |
          mkdir -p backup
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          for i in 1 2 3; do
            if "$PG_BIN/pg_dump" "$DATABASE_OWNER_URL" --no-owner --no-privileges \
                 -f "backup/reef-prod-$TIMESTAMP.sql"; then
              echo "Backup written to backup/reef-prod-$TIMESTAMP.sql"
              exit 0
            fi
            echo "Backup attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Backup failed after 3 attempts"
          exit 1

      # 2. Refuse to continue if the backup is suspiciously small. A dump under 1 KB
      #    means something failed silently (wrong database, wrong user, empty schema)
      #    and we do not want to apply migrations on top of that. On the first deploy,
      #    the target database is legitimately almost empty, so the check is skipped
      #    if there are no public tables yet.
      - name: Check the backup is real
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
        run: |
          SIZE=$(stat -c%s backup/*.sql)
          echo "Backup size: $SIZE bytes"
          TABLES=$("$PG_BIN/psql" "$DATABASE_OWNER_URL" -tA -c "select count(*) from information_schema.tables where table_schema = 'public'")
          echo "Public tables in the live database: $TABLES"
          if [ "$TABLES" -eq 0 ]; then
            echo "First deploy: no tables yet, backup size check skipped."
            exit 0
          fi
          if [ "$SIZE" -lt 1024 ]; then
            echo "Backup is too small to be a real database. Refusing to continue."
            exit 1
          fi

      - name: Upload backup as an artefact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: backup/
          retention-days: 30

      # 3. Apply every migration in order, as the owner user. The owner is the only
      #    role that can change the schema. The running API uses a different user
      #    (DATABASE_URL) that cannot alter tables.
      #
      #    Migrations are recorded in supabase_migrations.schema_migrations. A migration
      #    already recorded there is skipped, so this step can run on every deploy
      #    without re-applying what has already landed.
      - name: Apply migrations
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
        run: |
          "$PG_BIN/psql" "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -c "
            create schema if not exists supabase_migrations;
            create table if not exists supabase_migrations.schema_migrations (
              version text primary key,
              name text,
              applied_at timestamptz default now()
            );
          "
          for file in $(ls supabase/migrations/*.sql | sort); do
            VERSION=$(basename "$file" | cut -d_ -f1)
            APPLIED=$("$PG_BIN/psql" "$DATABASE_OWNER_URL" -tA -c "select 1 from supabase_migrations.schema_migrations where version = '$VERSION' limit 1")
            if [ "$APPLIED" = "1" ]; then
              echo "Skipping $file (already applied)"
              continue
            fi
            echo "Applying $file"
            "$PG_BIN/psql" "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -f "$file"
            "$PG_BIN/psql" "$DATABASE_OWNER_URL" -c "insert into supabase_migrations.schema_migrations (version, name) values ('$VERSION', '$(basename "$file" .sql)') on conflict (version) do nothing"
          done

      # 4. Build shared, then build the API. The API depends on the compiled output of
      #    shared, so shared has to build first.
      - name: Build shared
        working-directory: shared
        run: npm ci && npm run build

      - name: Build API
        working-directory: api
        run: npm ci && npm run build

      # 5. Trigger the Render deploy. The hook URL is a secret; the service rebuilds
      #    from the branch main automatically once the hook is called.
      - name: Deploy the API
        env:
          API_DEPLOY_HOOK: ${{ secrets.API_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "$API_DEPLOY_HOOK"

      # 6. Trigger the Vercel deploy.
      - name: Deploy the web app
        env:
          WEB_DEPLOY_HOOK: ${{ secrets.WEB_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "$WEB_DEPLOY_HOOK"

      # 7. Health check. The free tier takes 30 to 60 seconds to wake; the timeout
      #    below allows for that plus a margin. If the API does not answer, the
      #    deploy fails and the previous version remains in place.
      - name: Wait for the API to answer
        env:
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          echo "Polling $API_PUBLIC_URL/health"
          for i in $(seq 1 30); do
            if curl -fsS "$API_PUBLIC_URL/health" > /dev/null; then
              echo "API is up after $((i * 5)) seconds"
              exit 0
            fi
            sleep 5
          done
          echo "API did not answer within 150 seconds"
          exit 1

      # 8. Smoke test. Authenticate as each role, retrieve a site dashboard, submit a
      #    maintenance event, confirm it appears. This is filled in once the test
      #    users exist in the production database.
      - name: Smoke test
        env:
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          echo "Smoke test placeholder — to be filled in once the production"
          echo "database has the three test users and the script exists."
          # The real test will call a script in scripts/ that does the round trip.